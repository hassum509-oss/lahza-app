 return pfHead(u)+`<div style="text-align:center;padding:6px 14px 0"><button class="btn" onclick="openConvo('${u}')">💬 مراسلة</button> <button class="btn ${f?'g':''}" onclick="fol('${u}')">${f?'✓ صديق':'➕ إضافة'}</button> <button class="btn g" onclick="inviteDuet('${u}')">🤝 ثنائية</button> <button class="btn g" onclick="startCall('${u}',false)">📞</button> <button class="btn g" onclick="more('${u}')">⋯</button></div>`+pfStats(u)+`<div style="text-align:center;font-size:13px;color:var(--m)">${my?'تقييمك لهذا الشخص':'قيّمه — تقييمك يغيّر شكل بروفايله'}</div><div class="stars">${[1,2,3,4,5].map(i=>`<i class="${my&&my.score>=i?'on':''}" onclick="rateU('${u}',${i})">★</i>`).join('')}</div>`+pfTabs(u)};

 return h};

 const v=sec.querySelector('video'),b=sec.querySelector('.rpb'),r=reels.find(x=>x.id===sec.dataset.id);
 if(v){v.preload='auto';v.onerror=()=>{const e=sec.querySelector('.rerr');e&&e.classList.add('on')};v.onplaying=()=>{const e=sec.querySelector('.rerr');e&&e.classList.remove('on')}}

 if(!snd){v.muted=true;if(rAud)rAud.muted=true}
 v.ontimeupdate=()=>{if(b)b.style.width=(isFinite(v.duration)&&v.duration>0?v.currentTime/v.duration*100:0)+'%'};
 const nx=sec.nextElementSibling,nv=nx&&nx.querySelector('video');if(nv)nv.preload='auto';
 if(r&&r.authorId!==me&&!seen.has(r.id)){seen.add(r.id);vSend(r.id)}

const day0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function nextG(m,d){const t=day0();let x=new Date(t.getFullYear(),m-1,d);if(x<t)x=new Date(t.getFullYear()+1,m-1,d);return x}
let hf=null;try{hf=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric'})}catch(e){}
function nextH(m,d){if(!hf)return null;const t=day0();for(let i=0;i<400;i++){const x=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i),p=hf.formatToParts(x);if(+p.find(a=>a.type==='month').value===m&&+p.find(a=>a.type==='day').value===d)return x}return null}
let evL=[],evK='all';
const evRg=()=>{try{return JSON.parse(localStorage.getItem('lz_evr')||'[]')}catch(e){return[]}};
function evBuild(){const t=day0();evL=[...G.map(e=>({k:'g'+e[0]+'-'+e[1],i:e[2],n:e[3],t:'g',d:nextG(e[0],e[1])})),...H.map(e=>({k:'h'+e[0]+'-'+e[1],i:e[2],n:e[3],t:'h',d:nextH(e[0],e[1])}))].filter(e=>e.d).map(e=>({...e,left:Math.round((e.d-t)/864e5)})).sort((a,b)=>a.left-b.left)}
function evSheet(){if(!evL.length)evBuild();const R=evRg(),L=evL.filter(e=>evK==='all'||e.t===evK);
 const cd=n=>n===0?'اليوم 🎉':n===1?'باكر':n<31?'بعد '+n+' يوم':'بعد '+Math.round(n/30)+' شهر';
 sheet(`<b style="font:800 16px Cairo">🌍 فعاليات العالم</b><div class="qc" style="padding:8px 0">${[['all','الكل'],['g','عالمية'],['h','إسلامية']].map(k=>`<b style="${evK===k[0]?'border-color:var(--a2)':''}" onclick="evF('${k[0]}')">${k[1]}</b>`).join('')}</div><div style="max-height:60vh;overflow-y:auto">${L.map(e=>{const i=evL.indexOf(e);return `<div class="evr"><i>${e.i}</i><div class="t"><b>${e.n}</b><small>${e.d.toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long'})}${e.t==='h'?' · تقريبي':''}</small></div><span class="d">${cd(e.left)}</span><button onclick="evR(${i})">${R.includes(e.k)?'🔔':'🔕'}</button><button onclick="evS(${i})">📤</button></div>`}).join('')}</div>`)}
window.evOpen=()=>{evBuild();evSheet()};
window.evF=k=>{evK=k;evSheet()};
window.evR=i=>{const e=evL[i];let R=evRg();R=R.includes(e.k)?R.filter(x=>x!==e.k):[...R,e.k];try{localStorage.setItem('lz_evr',JSON.stringify(R))}catch(x){}toast(R.includes(e.k)?'راح أذكّرك 🔔':'أُلغي التذكير');evSheet()};
window.evS=i=>{const e=evL[i],tx=`${e.i} ${e.n} — ${e.d.toLocaleDateString('ar-IQ',{day:'numeric',month:'long'})} | لحظة`;if(navigator.share)navigator.share({text:tx}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>toast('انسخ ✨'))};
const hd=document.querySelector('header'),cb=hd&&hd.querySelector('button[onclick="openCam()"]');
