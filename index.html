const MEDIA_URL='https://lahza-media.hassum509.workers.dev'; // <-- ضع رابط الـ Worker هنا
const MEDIA_READY=!/YOUR-SUBDOMAIN/.test(MEDIA_URL);
function upMedia(file,kind,onProg){
  return new Promise(async(res,rej)=>{try{
    if(!MEDIA_READY)throw new Error('رابط Cloudflare غير مضبوط (MEDIA_URL)');
    const u=firebase.auth().currentUser;if(!u)throw new Error('سجّل دخولك أولاً');
    const tok=await u.getIdToken(),x=new XMLHttpRequest();
    x.open('POST',MEDIA_URL+'/upload?kind='+kind);
    x.setRequestHeader('Authorization','Bearer '+tok);
    x.setRequestHeader('Content-Type',(file.type||'application/octet-stream'));
    x.upload.onprogress=e=>{if(onProg&&e.lengthComputable)onProg(Math.round(e.loaded/e.total*100))};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300&&j.url?res(j.url):rej(new Error(j.error||('HTTP '+x.status)))};
    x.onerror=()=>rej(new Error('تعذّر الاتصال بخادم الوسائط'));
    x.send(file);
  }catch(e){rej(e)}});
}
function delMedia(url){try{if(!url||!MEDIA_READY||String(url).indexOf(MEDIA_URL+'/m/')!==0)return;
  firebase.auth().currentUser.getIdToken().then(t=>fetch(url,{method:'DELETE',headers:{Authorization:'Bearer '+t}})).catch(()=>{})}catch(e){}}
const isData=v=>typeof v==='string'&&v.length>2000&&/^data:(image|audio)\//.test(v);
const isPlain=v=>v&&typeof v==='object'&&Object.getPrototypeOf(v)===Object.prototype;
function hasData(v){return isData(v)||(Array.isArray(v)&&v.some(hasData))||(isPlain(v)&&Object.values(v).some(hasData))}
function dataToBlob(d){const m=/^data:([^;,]+)[^,]*;base64,(.*)$/.exec(d);if(!m)return null;const b=atob(m[2]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m[1]})}
async function offload(v,c){
  if(isData(v)){if(!c.has(v)){const b=dataToBlob(v);
    c.set(v,b?upMedia(b,b.type.indexOf('audio')===0?'voice':'images').catch(e=>{if(v.length<700000)return v;throw e}):Promise.resolve(v))}
    return c.get(v)}
  if(Array.isArray(v))return Promise.all(v.map(x=>offload(x,c)));
  if(isPlain(v)){const o={};for(const k of Object.keys(v))o[k]=await offload(v[k],c);return o}
  return v}
(function(){if(!MEDIA_READY)return; // قبل ضبط الرابط: السلوك القديم كما هو
  const P=firebase.firestore;
  [[P.CollectionReference.prototype,'add'],[P.DocumentReference.prototype,'set'],[P.DocumentReference.prototype,'update']].forEach(([pr,fn])=>{
    const orig=pr[fn];pr[fn]=function(...a){if(!a.some(hasData))return orig.apply(this,a);const c=new Map();
      return Promise.all(a.map(x=>offload(x,c))).then(r=>orig.apply(this,r))}})})();

(function(){
const app=()=>document.getElementById('app')||document.body;
const LZ=window.LZ={};

/* 1) تشغيل إجراء غير متزامن على زر: يمنع الضغط المكرر ويعرض تحميل/نجاح/فشل */
LZ.run=async function(btn,fn,o){
  o=o||{};
  if(btn&&(btn.dataset.lzBusy==='1'))return;           // منع الإرسال المكرر
  if(btn){btn.dataset.lzBusy='1';btn.classList.remove('ok','bad');btn.classList.add('busy')}
  try{
    const r=await fn();
    if(btn){btn.classList.remove('busy');if(o.flash!==false){btn.classList.add('ok');setTimeout(()=>btn.classList.remove('ok'),900)}}
    return r;
  }catch(e){
    if(btn){btn.classList.remove('busy');btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),1400)}
    if(o.retry!==false)LZ.undo(o.errMsg||'تعذّر تنفيذ الإجراء',()=>LZ.run(btn,fn,o),'إعادة المحاولة',6000);
    else toast(o.errMsg||'تعذّر تنفيذ الإجراء');
    console.warn('[LZ.run]',e);
  }finally{if(btn)delete btn.dataset.lzBusy}
};

/* 2) حوار تأكيد (Promise) بديل confirm() — للإجراءات الخطرة */
LZ.confirm=function(o){
  o=o||{};
  return new Promise(res=>{
    const d=document.createElement('div');d.className='lzdlg';d.setAttribute('role','alertdialog');
    d.innerHTML=`<div><h3></h3><p></p><div class="row"><button class="lzbtn" data-n></button><button class="lzbtn ${o.danger?'dng':'pri'}" data-y></button></div></div>`;
    d.querySelector('h3').textContent=o.title||'هل أنت متأكد؟';
    d.querySelector('p').textContent=o.msg||'';
    const n=d.querySelector('[data-n]'),y=d.querySelector('[data-y]');
    n.textContent=o.cancelText||'إلغاء';y.textContent=o.confirmText||'تأكيد';
    const done=v=>{d.remove();removeEventListener('keydown',k);res(v)};
    const k=e=>{if(e.key==='Escape')done(false)};
    n.onclick=()=>done(false);y.onclick=()=>done(true);

const MAP={'📞':'call','☎️':'call','📹':'video','🎥':'video','→':'back','←':'back','✕':'close','✖':'close','⚙️':'settings','🔔':'bell','💬':'chat','🗑️':'trash','🗑':'trash','🔒':'lock','🎙️':'mic','🎤':'mic','🔇':'micoff','↩️':'undo','↪️':'redo','✏️':'edit','🖼️':'image','🔖':'save','⚠️':'warn','📁':'folder','🔁':'repost'};
function fix(root){
  (root.querySelectorAll?root.querySelectorAll('button.ib,.prow>i,[data-ic]'):[]).forEach(el=>{
    if(el.dataset.lziDone)return;
    let n=el.dataset.ic;
    if(!n){if(el.children.length)return;n=MAP[el.textContent.trim()]}

  });
}

<script id="lzstory">
/* ===== أغنية الستوري: تُحفظ مع الستوري وتعمل عند المشاهدة ===== */
(function(){
let stSong=null,pend=null,sAud=null;
const stop=()=>{if(sAud){try{sAud.pause()}catch(e){}sAud=null}};
const clean=s=>s&&okH(s.url)?{title:String(s.title||'').slice(0,80),artist:String(s.artist||'').slice(0,60),url:s.url,art:okH(s.art)?s.art:''}:null;
const css=document.createElement('style');
css.textContent='#stsg,#tsg{display:flex;align-items:center;gap:8px;justify-content:center;padding:10px 14px;margin:0 0 12px;border-radius:14px;background:var(--s2);border:1px dashed var(--a);color:var(--t);font-size:13.5px;cursor:pointer}#ssg{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;max-width:80%;padding:7px 14px;border-radius:20px;background:#000a;backdrop-filter:blur(8px);font:700 12.5px Cairo;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}';
document.head.appendChild(css);
const upd=()=>{const e=$('stsg');if(e)e.innerHTML=stSong?'🎵 '+esc(stSong.title)+' — '+esc(stSong.artist||'')+' <b data-x style="color:var(--a2);padding:0 6px">✕</b>':'🎵 أضف أغنية للستوري'};
window.lzStSong=function(ev){
  if(ev&&ev.target&&ev.target.dataset&&ev.target.dataset.x!==undefined){stSong=null;upd();return}
  songSheet(s=>{stSong=clean(s);upd()})
};
/* شاشة المعاينة: زر الأغنية */
const _rv=review;
review=function(){stSong=null;pend=null;const r=_rv.apply(this,arguments);
  const c=$('cap');if(c&&!$('stsg')){c.insertAdjacentHTML('afterend','<div id="stsg" role="button" onclick="lzStSong(event)"></div>')}upd();return r};
/* النشر: نُلحق الأغنية بوثيقة الستوري عبر مسار النشر الأصلي (بما فيه رفع الصور) */
const _col=db.collection.bind(db);
db.collection=function(n){const c=_col(n);
  if(n==='stories'&&pend){const a=c.add.bind(c),sg=pend;pend=null;c.add=d=>a(Object.assign({},d,{song:sg}))}return c};
const _pp=pubPS;
pubPS=function(){pend=clean(stSong);const r=_pp.apply(this,arguments);Promise.resolve(r).finally(()=>{setTimeout(()=>{pend=null;stSong=null},4000)});return r};
/* المشاهدة: تشغيل الأغنية مع الستوري وإيقافها عند الانتقال أو الإغلاق */
const _sh=showS;
showS=function(){stop();const r=_sh.apply(this,arguments);const s=sq&&sq[si];
  if(s&&s.song&&okH(s.song.url)){
    const v=$('sv');if(v){v.insertAdjacentHTML('beforeend','<div id="ssg" role="button" aria-label="كتم/تشغيل الأغنية">🎵 '+esc(s.song.title||'')+(s.song.artist?' · '+esc(s.song.artist):'')+'</div>');
      const g=$('ssg');g.onclick=e=>{e.stopPropagation();if(sAud){sAud.muted=!sAud.muted;g.style.opacity=sAud.muted?.5:1}}}
    sAud=new Audio(s.song.url);sAud.loop=true;sAud.play().catch(()=>{})}
  return r};
/* ستوري نصي: نفس الأغنية + منع النشر المكرر */
let tSong=null,busy=0;
const tUpd=()=>{const e=$('tsg');if(e)e.innerHTML=tSong?'🎵 '+esc(tSong.title)+' <b data-x style="color:var(--a2);padding:0 6px">✕</b>':'🎵 أضف أغنية'};
window.lzTSong=function(ev){
  if(ev&&ev.target&&ev.target.dataset&&ev.target.dataset.x!==undefined){tSong=null;tUpd();return}
  $('stw').classList.remove('open');
  songSheet(s=>{if(s)tSong=clean(s);tUpd();openStW()})
};
const sbg=$('sbg');if(sbg&&!$('tsg'))sbg.insertAdjacentHTML('afterend','<div id="tsg" role="button" style="margin:0 0 12px" onclick="lzTSong(event)"></div>');tUpd();
const _ps=pubStory;
pubStory=function(){const i=$('sti');if(!i||!i.value.trim()||busy)return;busy=1;pend=clean(tSong);const r=_ps.apply(this,arguments);setTimeout(()=>{busy=0;pend=null;tSong=null;tUpd()},1500);return r};
const _cs=closeS;closeS=function(){stop();return _cs.apply(this,arguments)};
})();
</script>

    const self=this,c0=window.confirm;let msg=null;

  };

}

<script id="lzp3">
/* ===== v47: تحسينات الريلز (حفظ الموضع، لايك بالنقر المزدوج، توفير الذاكرة) + شريط انقطاع الإنترنت ===== */
(function(){
const st=document.createElement('style');
st.textContent='.hbrst{position:absolute;z-index:6;font-size:84px;line-height:1;pointer-events:none;transform:translate(-50%,-50%) scale(.4);opacity:0;animation:hbrst .8s ease-out forwards;filter:drop-shadow(0 4px 14px #0008)}@keyframes hbrst{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}#lzoff{position:fixed;top:0;left:0;right:0;z-index:99999;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:#b3261e;color:#fff;font:700 12.5px Cairo,sans-serif;text-align:center;transform:translateY(-110%);transition:transform .25s}#lzoff.on{transform:none}';
document.head.appendChild(st);

/* 1) لما ينزل ريل جديد (onSnapshot) لا يرجع المستخدم لأول الفيد */
const _dr=drawReels;
drawReels=function(){
  const m=$('main'),keep=rCur,had=!!$('rlw');
  _dr();
  if(had&&keep&&m){
    const s=m.querySelector('.rs[data-id="'+keep+'"]');
    if(s){m.scrollTop=s.getBoundingClientRect().top-m.getBoundingClientRect().top+m.scrollTop}
  }
};

/* 2) حماية: الـ observer ما ينهار إذا الفيديو مو موجود */
rlObserve=function(root){
  if(rObs)rObs.disconnect();
  rObs=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target.querySelector('video');if(!v)return;
    if(e.isIntersecting&&e.intersectionRatio>=.6)rlPlay(e.target);
    else{v.pause();if(rCur===e.target.dataset.id)rAudStop()}
  }),{root,threshold:[0,.6]});
  root.querySelectorAll('.rs').forEach(x=>rObs.observe(x));
};

/* 3) توفير الذاكرة: نفرّغ الفيديوهات البعيدة (أكثر من 2 عن الحالي) ونرجعها لما نقترب */
const _rp=rlPlay;
rlPlay=function(sec){
  const all=[...document.querySelectorAll('#rlw .rs')],i=all.indexOf(sec);
  all.forEach((x,j)=>{
    const v=x.querySelector('video');if(!v)return;
    if(Math.abs(j-i)<=2){if(!v.getAttribute('src')&&v.dataset.s)v.src=v.dataset.s}
    else if(v.getAttribute('src')){v.dataset.s=v.getAttribute('src');v.pause();v.removeAttribute('src');v.load()}
  });
  _rp(sec);
};

/* 4) لايك بالنقر المزدوج على الريل */
let lt=0;
document.addEventListener('click',e=>{

  s.appendChild(h);setTimeout(()=>h.remove(),850);
},true);

})();

<script id="lzp4">
/* ===== v48: زر الرجوع يسكّر النوافذ، Esc، ضغطة على التاب الحالي ترجعك لفوق، تذكّر موضع التمرير ===== */
(function(){
const SEL='.sheet.open,.sv.open';
const openList=()=>[...document.querySelectorAll(SEL)];
let depth=0,skip=false,skipT=0;

function closeEl(el){
  try{
    if(el.id==='cam'&&typeof closeCam==='function'){closeCam()}
    else if(el.id==='rvw'&&typeof closeRvw==='function'){closeRvw()}
    else{el.click()}
  }catch(e){}
  if(el.classList.contains('open'))el.classList.remove('open');
}

function sync(){
  const n=openList().length;
  try{
    if(n>depth){for(let i=depth;i<n;i++)history.pushState({lz:1},'');depth=n}
    else if(n<depth){
      const k=depth-n;depth=n;skip=true;clearTimeout(skipT);
      skipT=setTimeout(()=>{skip=false},700);
      history.go(-k);
    }
  }catch(e){}
}
new MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});

addEventListener('popstate',()=>{
  if(skip){skip=false;clearTimeout(skipT);return}
  const l=openList();
  if(depth>0&&l.length){depth--;closeEl(l[l.length-1])}
  else depth=0;
});

addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const l=openList();if(l.length)closeEl(l[l.length-1]);
});

/* ضغطة على التاب الفعّال وأنت نازل بالفيد = ترجع لفوق بسلاسة */
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('#home nav button');
  if(!b||!b.classList.contains('on'))return;
  const m=$('main');
  if(m&&m.scrollTop>150){e.stopPropagation();e.preventDefault();m.scrollTo({top:0,behavior:'smooth'})}
},true);

/* تذكّر موضع التمرير لكل تاب (لمدة 5 دقايق) */
const SP={},_t=tab;
tab=function(t){
  const m=$('main'),prev=cur;
  if(m&&prev&&prev!=='reels')SP[prev]={y:m.scrollTop,ts:Date.now()};
  _t(t);
  const s=SP[t];
  if(m&&t!==prev&&t!=='reels'&&s&&s.y>0&&Date.now()-s.ts<300000)m.scrollTop=s.y;
};
})();
</script>
